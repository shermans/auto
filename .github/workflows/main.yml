name: Auto Update Node Subscriptions

on:
  schedule:
    # UTC 时间 0,4,8,12,16,20 对应北京时间(UTC+8) 08:00, 12:00, 16:00, 20:00, 00:00, 04:00
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    
    steps:
    # 升级至 v5 版本消除 Node.js 20 警告
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set System Timezone to Asia/Shanghai
      run: |
        sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
        echo "Asia/Shanghai" | sudo tee /etc/timezone

    # 升级至 v6 版本消除 Node.js 20 警告
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install sing-box Engine
      run: |
        curl -sL https://github.com/SagerNet/sing-box/releases/download/v1.8.11/sing-box-1.8.11-linux-amd64.tar.gz | tar -xz --strip-components=1
        chmod +x sing-box

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Script
      run: |
        python main.py

    - name: Commit and Push Results
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.io'
        
        # 将生成的节点文件（包含 Base64 版与 ACL 精简 Clash 版）及统计明细添加至 Git 暂存区
        git add ALL.txt US.txt AI.txt OTHER.txt SALL.txt SUS.txt linksdetails.txt
        
        # 安全检查：如果无任何文件改动，正常退出（exit 0）不抛出错误
        if git diff --staged --quiet; then
          echo "没有任何文件发生变动，安全跳过提交。"
          exit 0
        fi
        
        NOW=$(date '+%Y-%m-%d %H:%M:%S')
        git commit -m "Auto-update nodes: ${NOW}"
        git push
