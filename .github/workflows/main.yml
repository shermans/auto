name: Auto Sub

on:
  # 定时触发：这里设置的是每天北京时间 08:00 和 20:00 各执行一次（UTC 0点和12点）
  schedule:
    - cron: '0 0,12 * * *'
  
  # 允许你在 GitHub 仓库的 Actions 页面手动点击按钮强制运行
  workflow_dispatch:

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出仓库代码
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安装依赖库（你的脚本只用了 requests，这里自动安装）
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. 运行你的 Python 脚本（请把 main.py 替换为你实际的脚本文件名）
    - name: Run Script
      run: |
        python main.py

    # 5. 自动将更新后的 txt 文件提交并推送到 GitHub 仓库
    - name: Commit and Push Results
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.io'
        
        # 检查是否有文件变动
        git status
        
        # 添加生成的三个结果文件
        git add ALL.txt US.txt OTHER.txt
        
        # 如果没有内容变化则跳过提交
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update nodes: $(date '+%Y-%m-%d %H:%M:%S')" && git push)
