name: Auto Update Node Subscriptions

on:
  schedule:
    - cron: '0 8,12,16,20,24,4 * * *'
  workflow_dispatch:

# 关键：赋予工作流对仓库内容的读写权限，解决 128 权限拒绝错误
permissions:
  contents: write

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Script
      run: |
        python main.py

    - name: Commit and Push Results
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.io'
        
        # 将生成的文件加入暂存区
        git add ALL.txt US.txt OTHER.txt
        
        # 检查是否有实际改动，没有改动则安全退出
        if git diff --staged --quiet; then
          echo "没有检测到节点文件有任何更新，跳过提交。"
          exit 0
        fi
        
        # 有改动则提交并推送
        git commit -m "Auto-update nodes: $(date '+%Y-%m-%d %H:%M:%S')"
        git push
