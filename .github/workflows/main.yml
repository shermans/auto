name: Auto Update Node Subscriptions

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

# 赋予工作流对仓库内容的读写权限，解决 128 权限拒绝错误
permissions:
  contents: write

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 新增：自动获取并解压最新版 sing-box 单文件内核
    - name: Install sing-box Engine
      run: |
        curl -sL https://github.com/SagerNet/sing-box/releases/download/v1.8.11/sing-box-1.8.11-linux-amd64.tar.gz | tar -xz --strip-components=1
        chmod +x sing-box

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Script
      run: |
        python main.py

    - name: Commit and Push Results
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.io'
        
        # 将生成的所有节点文件以及抓取明细文件加入暂存区
        git add ALL.txt US.txt AI.txt OTHER.txt linksdetails.txt
        
        # 检查是否有实际改动，没有改动则安全退出
        if git diff --staged --quiet; then
          echo "没有检测到节点文件有任何更新，跳过提交。"
          exit 0
        fi
        
        # 使用北京时间生成 Commit 信息并提交推送
        NOW=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
        git commit -m "Auto-update nodes: ${NOW}"
        git push
