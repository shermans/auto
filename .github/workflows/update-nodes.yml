name: Update US Nodes

on:
  schedule:
    # 每 6 小时自动运行一次 (你可以修改 Cron 表达式)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发运行

# 必须赋予写权限，否则 git push 会报退出代码 128
permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行节点抓取与处理脚本
        run: python main.py

      - name: 提交变更并推送至 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 暂存生成的文件
          git add US.txt linksdetails.txt
          
          # 检查是否有文件变更，避免在无新变更时提交产生 Exit Code 128 错误
          if git diff --staged --quiet; then
            echo "没有更新变更，跳过提交。"
          else
            git commit -m "auto: update US nodes [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
